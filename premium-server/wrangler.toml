# Kapa Premium server. GitHub deploys it automatically (.github/workflows/deploy-premium-server.yml).
# The KV namespace id is filled in by the workflow; no secret is ever written in this file.
name = "kapa-premium"
main = "kapa-premium-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
PRICE_XOF = "0"            # Premium price in CFA francs, once CinetPay is set up (a multiple of 5)
PLAN_DAYS = "30"
CURRENCY = "XOF"
SITE_URL = "https://bobgick453.github.io/kapa-trader/"
ALLOWED_ORIGINS = "https://bobgick453.github.io"

[[kv_namespaces]]
binding = "KAPA_KV"
id = "__KAPA_KV_ID__"
