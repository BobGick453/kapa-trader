<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Copier le serveur Kapa</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #071026; color: #eef2ff; }
  main { max-width: 34rem; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 8px; color: #f5c542; }
  p { color: #c8d1ec; margin: 0 0 16px; }
  button { width: 100%; min-height: 56px; border: 0; border-radius: 14px; font: 700 18px system-ui, sans-serif; color: #1f1600; background: linear-gradient(90deg, #f7d64a, #eab308); cursor: pointer; }
  button:disabled { opacity: .6; }
  #status { margin-top: 16px; padding: 14px; border-radius: 12px; background: #0d1a3a; border: 1px solid #1d2e5c; min-height: 24px; }
  #status.ok { border-color: #22c57a; color: #5fe3a1; }
  #status.err { border-color: #ef4458; color: #ffb3bb; }
  textarea { width: 100%; box-sizing: border-box; height: 160px; margin-top: 16px; background: #0b1631; color: #93a3cc; border: 1px solid #1d2e5c; border-radius: 12px; font: 12px/1.4 ui-monospace, monospace; padding: 10px; display: none; }
  ol { color: #c8d1ec; padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1>Code du serveur Kapa Premium</h1>
  <p>Touchez le bouton : tout le code est copié. Retournez ensuite dans Cloudflare pour le coller.</p>
  <button id="copy" disabled>Chargement…</button>
  <div id="status" role="status"></div>
  <textarea id="code" readonly aria-label="Code du serveur"></textarea>
  <ol>
    <li>Cloudflare → votre Worker <b>kapa-premium</b> → <b>Edit code</b>.</li>
    <li>Dans l'éditeur, effacez tout le code affiché.</li>
    <li>Collez (appui long → <b>Coller</b>).</li>
    <li>Touchez <b>Deploy</b>.</li>
  </ol>
</main>
<script>
  const btn = document.getElementById('copy');
  const status = document.getElementById('status');
  const area = document.getElementById('code');
  const say = (text, cls) => { status.textContent = text; status.className = cls || ''; };
  let code = '';
  fetch('kapa-premium-worker.js', { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then((t) => {
      code = t;
      area.value = t;
      btn.disabled = false;
      btn.textContent = 'Copier le code (' + t.length.toLocaleString('fr-FR') + ' caractères)';
    })
    .catch(() => say("Le code n'a pas pu être chargé. Rechargez la page.", 'err'));
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(code);
      say('✓ Code copié. Collez-le maintenant dans Cloudflare (Edit code).', 'ok');
    } catch {
      // Older browsers: select the text so the user can copy it by hand
      area.style.display = 'block';
      area.focus();
      area.select();
      say('Copie automatique impossible : le code est sélectionné ci-dessous, faites appui long → Copier.', 'err');
    }
  });
</script>
</body>
</html>
